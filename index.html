<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Казино «Путь» — Grand Casino Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"] {
  --bg: #080b10;
  --bg-accent: #132a1c;
  --panel: rgba(20, 27, 36, 0.92);
  --panel-solid: #141b24;
  --panel2: #1c2633;
  --panel3: #243040;
  --line: #2c3a4b;
  --line-bright: #3d5066;
  --gold: #f0b938;
  --gold-dim: rgba(240, 185, 56, 0.16);
  --gold-glow: rgba(240, 185, 56, 0.4);
  --green: #2ea043;
  --green-bg: rgba(46, 160, 67, 0.16);
  --green-text: #7ee787;
  --red: #f85149;
  --red-bg: rgba(248, 81, 73, 0.16);
  --red-text: #ff9a94;
  --text: #eef3f8;
  --muted: #93a3b5;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  --die-bg: #f8fafc;
  --die-text: #0f172a;
  --die-shadow: #cbd5e1;
  --lane-track: #0b0f15;
}

:root[data-theme="light"] {
  --bg: #f3f0e8;
  --bg-accent: #d9ece0;
  --panel: rgba(255, 255, 255, 0.94);
  --panel-solid: #ffffff;
  --panel2: #f4f1ea;
  --panel3: #e8e3d8;
  --line: #d6cfc2;
  --line-bright: #b8afa0;
  --gold: #b7791f;
  --gold-dim: rgba(183, 121, 31, 0.14);
  --gold-glow: rgba(183, 121, 31, 0.28);
  --green: #1f7a34;
  --green-bg: rgba(31, 122, 52, 0.12);
  --green-text: #166534;
  --red: #cf222e;
  --red-bg: rgba(207, 34, 46, 0.12);
  --red-text: #991b1b;
  --text: #1c2430;
  --muted: #5c6877;
  --shadow: 0 10px 26px rgba(28, 36, 48, 0.08);
  --die-bg: #ffffff;
  --die-text: #111827;
  --die-shadow: #cbd5e1;
  --lane-track: #e2ddd2;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(1200px 650px at 50% -10%, var(--bg-accent) 0%, var(--bg) 65%);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  padding: 16px;
  transition: background 0.3s ease, color 0.25s ease;
}

.wrap {
  max-width: 1180px;
  margin: 0 auto;
}

/* Верхняя панель управления (Виджеты времени, темы, языка) */
.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(10px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  background: var(--gold-dim);
  border: 1px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 0 16px var(--gold-glow);
}

h1 {
  font-size: 20px;
  font-weight: 800;
  margin: 0;
  color: var(--gold);
  letter-spacing: 0.3px;
}

.brand-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.datetime-widget {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 6px 12px;
  font-size: 12px;
}

.datetime-widget .clock-icon {
  font-size: 16px;
}

.datetime-widget .time-str {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  color: var(--gold);
}

.datetime-widget .date-str {
  color: var(--muted);
  font-size: 11px;
}

.ctrl-select,
.ctrl-btn {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.18s ease;
}

.ctrl-select:hover,
.ctrl-btn:hover {
  border-color: var(--gold);
  background: var(--panel3);
}

.ctrl-select:focus,
.ctrl-btn:focus {
  outline: 2px solid var(--gold);
  outline-offset: 1px;
}

/* Статистика игрока */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.stat {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}

.stat-info span {
  display: block;
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 600;
}

.stat-info strong {
  font-size: 18px;
  font-weight: 800;
  color: var(--gold);
  font-family: 'JetBrains Mono', monospace;
}

.stat-icon {
  font-size: 22px;
  opacity: 0.85;
}

/* Дорожка домов (Путь) */
.path-wrap {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

.path-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--muted);
}

.path-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.path {
  display: grid;
  grid-template-columns: repeat(10, minmax(68px, 1fr));
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.house {
  height: 76px;
  border-radius: 12px;
  background: var(--panel2);
  border: 2px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  transition: all 0.22s ease;
  opacity: 0.65;
  position: relative;
  cursor: pointer;
  user-select: none;
}

.house:hover {
  opacity: 0.95;
  border-color: var(--line-bright);
  transform: translateY(-2px);
}

.house .num {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
}

.house .ic {
  font-size: 22px;
}

.house .hname {
  font-size: 9px;
  color: var(--muted);
  max-width: 90%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.house.active {
  border-color: var(--gold);
  background: var(--gold-dim);
  box-shadow: 0 0 18px var(--gold-glow);
  opacity: 1;
  transform: translateY(-3px);
}

.house.done {
  opacity: 1;
  border-color: var(--green);
  background: var(--green-bg);
}

.house.done .status-dot {
  position: absolute;
  top: 4px;
  right: 5px;
  font-size: 10px;
}

/* Основная сетка */
.layout {
  display: grid;
  grid-template-columns: 1fr 310px;
  gap: 14px;
}

@media (max-width: 880px) {
  .layout {
    grid-template-columns: 1fr;
  }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
}

.panel.center {
  text-align: center;
}

.house-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 8px;
}

.house-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}

.panel h2 {
  margin: 6px 0 8px;
  font-size: 22px;
  color: var(--gold);
}

.hint {
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.6;
  margin: 8px 0 16px;
}

.hint b {
  color: var(--gold);
}

/* Кнопки */
.btn {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn:hover:not(:disabled) {
  background: var(--panel3);
  border-color: var(--gold);
  transform: translateY(-1px);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn.primary {
  background: linear-gradient(180deg, #f3c14b, #cf9823);
  color: #1e1604;
  font-weight: 700;
  border: none;
  box-shadow: 0 4px 14px var(--gold-glow);
}

.btn.primary:hover:not(:disabled) {
  filter: brightness(1.08);
}

.btn.next-house {
  background: var(--green-bg);
  color: var(--green-text);
  border: 1px solid var(--green);
  font-weight: 700;
}

.btn.next-house:hover:not(:disabled) {
  background: var(--green);
  color: #fff;
}

.btn.sm {
  padding: 6px 12px;
  font-size: 12px;
  border-radius: 9px;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
  justify-content: center;
}

/* Блок ставки */
.betbox {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin: 12px 0;
}

.bet-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}

.bet-row input[type=range] {
  flex: 1;
  accent-color: var(--gold);
  cursor: pointer;
}

.bet-row strong {
  color: var(--gold);
  font-size: 19px;
  font-family: 'JetBrains Mono', monospace;
  min-width: 120px;
  text-align: right;
}

.quick {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.quick button {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: 0.15s;
}

.quick button:hover {
  color: var(--gold);
  border-color: var(--gold);
}

/* Кубики */
.die {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: var(--die-bg);
  color: var(--die-text);
  font-weight: 800;
  font-size: 20px;
  margin: 4px;
  box-shadow: 0 4px 0 var(--die-shadow);
  animation: popIn 0.25s ease;
}

.die.human {
  background: linear-gradient(180deg, #f3c14b, #d89f26);
  color: #1e1604;
  box-shadow: 0 4px 0 #9e7112;
}

@keyframes popIn {
  0% { transform: scale(0.7) rotate(-10deg); opacity: 0.4; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

/* Дорожки тараканьих бегов */
.lanes {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 14px 0;
}

.lane {
  display: flex;
  align-items: center;
  gap: 10px;
}

.lane-name {
  width: 135px;
  font-size: 13px;
  color: var(--muted);
  text-align: left;
}

.lane.human .lane-name {
  color: var(--gold);
  font-weight: 700;
}

.lane-bar {
  flex: 1;
  height: 18px;
  background: var(--lane-track);
  border-radius: 9px;
  overflow: hidden;
  border: 1px solid var(--line);
}

.lane-fill {
  height: 100%;
  background: linear-gradient(90deg, #2ea043, #7ee787);
  width: 0;
  transition: width 0.35s ease;
}

.lane.human .lane-fill {
  background: linear-gradient(90deg, #c69427, #f0b938);
}

.lane-pos {
  width: 44px;
  text-align: right;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted);
}

/* Таблица карт 6x6 */
.cardgrid {
  border-collapse: separate;
  border-spacing: 4px;
  margin: 12px auto;
  font-size: 13px;
}

.cardgrid th {
  color: var(--muted);
  font-weight: 600;
  padding: 4px 8px;
  font-size: 11px;
}

.cardgrid td {
  width: 42px;
  height: 36px;
  text-align: center;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 7px;
  font-weight: 700;
  color: var(--text);
  transition: 0.2s;
}

.cardgrid td.hl {
  background: var(--gold);
  color: #1e1604;
  box-shadow: 0 0 14px var(--gold-glow);
  transform: scale(1.08);
}

.sumline {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 10px 0;
  font-size: 15px;
}

.sumline b {
  color: var(--gold);
  font-size: 20px;
  font-family: 'JetBrains Mono', monospace;
}

/* Слоты */
.reels {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin: 14px 0;
}

.reel {
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: var(--lane-track);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px;
}

.reel .cell {
  width: 56px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  background: var(--panel2);
  border-radius: 8px;
  opacity: 0.45;
  transition: 0.2s;
}

.reel .cell.hl {
  opacity: 1;
  background: var(--gold-dim);
  border: 1px solid var(--gold);
  box-shadow: 0 0 14px var(--gold-glow);
  transform: scale(1.06);
}

/* Дартс */
.throws {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 12px 0;
}

.throw {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
}

.throw b {
  display: block;
  color: var(--gold);
  font-size: 18px;
  margin-top: 2px;
}

/* Рулетка */
.opts {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 10px 0;
}

.opt {
  background: var(--panel2);
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 10px 16px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: 0.18s;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 6px;
}

.opt.sel {
  border-color: var(--gold);
  background: var(--gold-dim);
  color: var(--gold);
}

.numinput {
  width: 72px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 8px;
  color: var(--text);
  font-size: 14px;
  font-weight: 700;
  text-align: center;
  font-family: inherit;
}

.legend {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  margin-top: 8px;
  line-height: 1.7;
}

.legend .r {
  color: var(--red-text);
  font-weight: 600;
}

.legend .b {
  color: var(--text);
  font-weight: 600;
}

/* Блок результата и ручного перехода в следующий дом */
.result {
  margin-top: 14px;
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
}

.result.win {
  background: var(--green-bg);
  border: 1px solid var(--green);
  color: var(--green-text);
}

.result.lose {
  background: var(--red-bg);
  border: 1px solid var(--red);
  color: var(--red-text);
}

.result.push {
  background: var(--gold-dim);
  border: 1px solid var(--gold);
  color: var(--gold);
}

.decision-bar {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  align-items: center;
}

/* Журнал событий */
.log-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.log h3 {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

#logList {
  display: flex;
  flex-direction: column;
  gap: 7px;
  max-height: 460px;
  overflow-y: auto;
}

.logitem {
  background: var(--panel2);
  border-left: 3px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
}

.logitem.win {
  border-color: var(--green);
  color: var(--green-text);
}

.logitem.lose {
  border-color: var(--red);
  color: var(--red-text);
}

/* Модальное окно */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.78);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 20px;
  backdrop-filter: blur(5px);
}

.overlay.hidden {
  display: none;
}

.modal {
  background: var(--panel-solid);
  border: 2px solid var(--gold);
  border-radius: 18px;
  padding: 32px;
  max-width: 460px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 60px var(--gold-glow);
}

.modal .big {
  font-size: 56px;
  margin-bottom: 10px;
}

.modal h2 {
  margin: 0 0 12px;
  color: var(--gold);
  font-size: 24px;
}

.modal p {
  color: var(--muted);
  line-height: 1.6;
  font-size: 14px;
}
</style>
</head>
<body>
<div class="wrap">
  <!-- Верхняя панель: название, часы/дата, тема, язык, звук -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">🎰</div>
      <div>
        <h1 id="appTitle">Казино «Путь»</h1>
        <div class="brand-sub" id="appSub">Свободный выбор перехода между домами</div>
      </div>
    </div>

    <div class="toolbar">
      <!-- Виджет реального времени и даты -->
      <div class="datetime-widget" title="Real-time clock">
        <span class="clock-icon">🕒</span>
        <div>
          <div class="time-str" id="clockTime">--:--:--</div>
          <div class="date-str" id="clockDate">---</div>
        </div>
      </div>

      <!-- Выбор языка -->
      <select class="ctrl-select" id="langSelect" aria-label="Language">
        <option value="ru">🇷🇺 Русский</option>
        <option value="en">🇬🇧 English</option>
        <option value="kk">🇰🇿 Қазақша</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="es">🇪🇸 Español</option>
        <option value="zh">🇨🇳 中文</option>
      </select>

      <!-- Переключатель темы -->
      <button class="ctrl-btn" id="themeBtn" type="button">
        <span id="themeIcon">🌙</span>
        <span id="themeLabel">Тёмная</span>
      </button>

      <!-- Звук -->
      <button class="ctrl-btn" id="soundBtn" type="button">
        <span id="soundIcon">🔊</span>
      </button>
    </div>
  </header>

  <!-- Панель статистики -->
  <section class="stats-bar">
    <div class="stat">
      <div class="stat-info">
        <span id="lblCapital">Капитал</span>
        <strong id="money">5 000 ₽</strong>
      </div>
      <div class="stat-icon">💰</div>
    </div>
    <div class="stat">

/* =====================================================================
   УТИЛИТЫ, ЗВУК, ТЕМА, ЧАСЫ
   ===================================================================== */
const d6 = () => 1 + Math.floor(Math.random() * 6);
const shuffle = a => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const $ = id => document.getElementById(id);

let currentLang = 'ru';
let currentTheme = 'dark';
let soundEnabled = true;
let audioCtx = null;

try {
  const savedLang = localStorage.getItem('casino_lang');
  if (savedLang && I18N[savedLang]) currentLang = savedLang;
  const savedTheme = localStorage.getItem('casino_theme');
  if (savedTheme === 'light' || savedTheme === 'dark') currentTheme = savedTheme;
} catch (e) {}

const t = () => I18N[currentLang];
const tpl = (str, vars = {}) => str.replace(/\{(\w+)\}/g, (_, k) => (vars[k] !== undefined ? vars[k] : ''));

function fmt(n) {
  const cfg = t();
  const formatted = Math.round(n).toLocaleString(cfg.locale);
  return cfg.currency === '$' || cfg.currency === '¥' ? `${cfg.currency}${formatted}` : `${formatted} ${cfg.currency}`;
}

function playTone(freq = 440, dur = 0.09, type = 'sine', gainVal = 0.06) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function sfxRoll() { playTone(320, 0.07, 'triangle', 0.05); setTimeout(() => playTone(480, 0.07, 'triangle', 0.05), 55); }
function sfxWin() { playTone(523, 0.1, 'sine', 0.07); setTimeout(() => playTone(659, 0.1, 'sine', 0.07), 90); setTimeout(() => playTone(784, 0.18, 'sine', 0.08), 180); }
function sfxLose() { playTone(240, 0.14, 'sawtooth', 0.05); setTimeout(() => playTone(180, 0.2, 'sawtooth', 0.05), 110); }

/* Реальное время и дата с учётом выбранного языка */
function updateClock() {
  const now = new Date();
  const locale = t().locale;
  try {
    $('clockTime').textContent = new Intl.DateTimeFormat(locale, {
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    }).format(now);
    $('clockDate').textContent = new Intl.DateTimeFormat(locale, {
      weekday: 'short',
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    }).format(now);
  } catch (e) {
    $('clockTime').textContent = now.toLocaleTimeString();
    $('clockDate').textContent = now.toLocaleDateString();
  }
}
setInterval(updateClock, 1000);

function applyTheme() {
  document.documentElement.setAttribute('data-theme', currentTheme);
  $('themeIcon').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
  $('themeLabel').textContent = currentTheme === 'dark' ? t().themeDark : t().themeLight;
  try { localStorage.setItem('casino_theme', currentTheme); } catch (e) {}
}

function applyStaticLabels() {
  const L = t();
  document.documentElement.lang = currentLang;
  $('appTitle').textContent = L.title;
  $('appSub').textContent = L.sub;
  $('lblCapital').textContent = L.capital;
  $('lblProfit').textContent = L.profit;

  $('prevHouseTopBtn').textContent = L.prevHouse;
  $('nextHouseTopBtn').textContent = S && S.pos === PATH_LENGTH ? L.toFinish : L.nextHouse;
  $('lblLog').textContent = L.logTitle;

  applyTheme();
  updateClock();
}

/* =====================================================================
   КОНСТАНТЫ И СОСТОЯНИЕ ИГРЫ
   ===================================================================== */
const START_MONEY = 5000;
const MIN_BET = 100;
const PATH_LENGTH = 10;

let S = null;
let activeRound = false; // идёт ли сейчас розыгрыш внутри дома

function newGame() {
  const bag = [];
  const keys = Object.keys(GAME_ICONS);
  while (bag.length < PATH_LENGTH) bag.push(...shuffle([...keys]));
  S = {
    money: START_MONEY,
    pos: 0,
    houses: bag.slice(0, PATH_LENGTH).map(type => ({ type, done: false, rounds: 0, lastResult: null })),
    over: false,
    log: []
  };
  activeRound = false;
  $('overlay').classList.add('hidden');
  $('logList').innerHTML = '';
  addLog(tpl(t().logStart, { money: fmt(START_MONEY), len: PATH_LENGTH }));
  renderBoard();
}

/* =====================================================================
   ЖУРНАЛ
   ===================================================================== */
function addLog(text, cls = '') {
  S.log.unshift({ text, cls });
  const el = document.createElement('div');
  el.className = 'logitem ' + cls;
  el.textContent = text;
  const list = $('logList');
  list.insertBefore(el, list.firstChild);
  while (list.children.length > 40) list.removeChild(list.lastChild);
}

/* =====================================================================
   НАВИГАЦИЯ МЕЖДУ ДОМАМИ (РУЧНОЕ УПРАВЛЕНИЕ ИГРОКОМ)
   ===================================================================== */
function goToHouse(targetPos) {
  if (S.over || activeRound) return;
  if (targetPos < 0 || targetPos > PATH_LENGTH + 1) return;
  S.pos = targetPos;
  if (S.pos >= 1 && S.pos <= PATH_LENGTH) {
    const h = S.houses[S.pos - 1];
    const gName = t().games[h.type].name;
    addLog(tpl(t().logMoved, { pos: S.pos, game: gName }));
  }
  playTone(400, 0.06, 'sine', 0.04);
  renderBoard();
}

/* =====================================================================
   ОТРИСОВКА ИНТЕРФЕЙСА
   ===================================================================== */
function renderStats() {
  $('money').textContent = fmt(S.money);
  $('money').style.color = S.money < 1000 ? 'var(--red)' : 'var(--gold)';

  const diff = S.money - START_MONEY;
  const sign = diff > 0 ? '+' : '';
  $('profitVal').textContent = sign + fmt(diff);
  $('profitVal').style.color = diff > 0 ? 'var(--green-text)' : diff < 0 ? 'var(--red-text)' : 'var(--gold)';

  const doneCnt = S.houses.filter(h => h.done).length;
  $('doneCount').textContent = `${doneCnt} / ${PATH_LENGTH}`;

  const L = t();
  $('posLabel').textContent = S.pos === 0 ? L.start : (S.pos > PATH_LENGTH ? L.finish : `${S.pos} / ${PATH_LENGTH}`);

  $('prevHouseTopBtn').disabled = activeRound || S.pos <= 1 || S.pos > PATH_LENGTH;
  $('nextHouseTopBtn').disabled = activeRound || S.pos > PATH_LENGTH;
  $('nextHouseTopBtn').textContent = S.pos === PATH_LENGTH ? L.toFinish : L.nextHouse;
}

function renderPath() {
  const L = t();
  $('path').innerHTML = S.houses.map((h, i) => {
    const idx = i + 1;
    const cls = ['house'];
    if (h.done) cls.push('done');
    if (idx === S.pos) cls.push('active');
    const gName = L.games[h.type].name;
    return `<div class="${cls.join(' ')}" data-idx="${idx}" title="${idx}. ${gName}">
      ${h.done ? '<span class="status-dot">✅</span>' : ''}
      <div class="num">#${idx}</div>
      <div class="ic">${GAME_ICONS[h.type]}</div>
      <div class="hname">${gName}</div>
    </div>`;
  }).join('');

  $('path').querySelectorAll('.house').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx, 10);
      if (!activeRound) goToHouse(idx);
    });
  });
}

function renderBoard() {
  applyStaticLabels();
  renderStats();
  renderPath();
  const area = $('gameArea');
  area.innerHTML = '';

  if (S.over) return;
  if (S.pos === 0) return renderStart();
  if (S.pos > PATH_LENGTH) return renderFinish();

  const house = S.houses[S.pos - 1];
  return renderHouse(house);
}

function renderStart() {
  const L = t();
  $('gameArea').innerHTML = `
    <div class="panel center">
      <h2>${L.welcomeTitle}</h2>
      <p class="hint">${tpl(L.welcomeDesc, { money: fmt(START_MONEY), len: PATH_LENGTH })}</p>
      <div class="row">
        <button class="btn primary" id="startBtn" type="button">${L.enterFirst}</button>
      </div>
    </div>`;
  $('startBtn').addEventListener('click', () => goToHouse(1));
}

function renderFinish() {
  const L = t();
  const diff = S.money - START_MONEY;
  const rich = diff > 0;
  const sign = diff > 0 ? '+' : '';
  $('gameArea').innerHTML = `
    <div class="panel center">
      <h2>${rich ? L.finishRichTitle : L.finishSafeTitle}</h2>
      <p class="hint">
        ${tpl(L.finishDesc, {
          money: fmt(S.money),
          profit: sign + fmt(diff),
          extra: rich ? L.finishExtraWin : L.finishExtraEven
        })}
      </p>
      <div class="row">
        <button class="btn" id="backHousesBtn" type="button">${L.backToHouses}</button>
        <button class="btn primary" id="againBtn" type="button">${L.playAgainMain}</button>
      </div>
    </div>`;
  $('backHousesBtn').addEventListener('click', () => goToHouse(PATH_LENGTH));
  $('againBtn').addEventListener('click', newGame);
}

function renderHouse(house) {
  const L = t();
  const g = L.games[house.type];
  const icon = GAME_ICONS[house.type];
  const isLast = S.pos === PATH_LENGTH;

  const area = $('gameArea');
  area.innerHTML = `
    <div class="panel">
      <div class="house-top">
        <div class="house-badge">${tpl(L.houseBadge, { pos: S.pos, len: PATH_LENGTH })}</div>
        ${house.rounds > 0 ? `<div class="house-badge" style="border-color:var(--green);color:var(--green-text)">${tpl(L.playedBadge, { cnt: house.rounds })}</div>` : ''}
      </div>
      <h2>${icon} ${g.name}</h2>
      <p class="hint">${g.desc}</p>

      <div class="betbox" id="betbox">
        <div class="bet-row">
          <span style="color:var(--muted);font-size:13px;font-weight:600">${L.betLabel}</span>
          <input type="range" id="betRange">
          <strong id="betVal"></strong>
        </div>
        <div class="quick" id="quickBets">
          <button type="button" data-b="100">100</button>
          <button type="button" data-b="500">500</button>
          <button type="button" data-b="1000">1000</button>
          <button type="button" data-b="half">1/2</button>
          <button type="button" data-b="all">${L.allIn}</button>
        </div>
        <div class="row" style="margin-top:6px">
          <button class="btn primary" id="playBtn" type="button">${L.placeBetBtn}</button>
          <button class="btn next-house" id="skipOrNextBtn" type="button">
            ${isLast ? L.finishJourneyBtn : L.goNextHouseBtn}
          </button>
        </div>
      </div>

      <div id="gameBody" style="display:none"></div>
      <div id="postRoundControls" class="decision-bar" style="display:none">
        <button class="btn" id="playAgainInHouseBtn" type="button">${L.playAgainHouseBtn}</button>
        <button class="btn next-house" id="manualNextHouseBtn" type="button">
          ${isLast ? L.finishJourneyBtn : L.goNextHouseBtn}
        </button>
      </div>
    </div>`;

  const minBet = Math.min(MIN_BET, S.money);
  const maxBet = S.money;
  const step = Math.max(10, Math.floor((maxBet - minBet) / 50) || 10);
  const range = $('betRange');
  range.min = minBet;
  range.max = maxBet;
  range.step = step;
  range.value = Math.min(maxBet, Math.max(minBet, 200));

  const betVal = $('betVal');
  const updateBet = () => {
    const v = Math.min(maxBet, Math.max(minBet, Math.round(range.value)));
    betVal.textContent = fmt(v);
  };
  range.addEventListener('input', updateBet);
  updateBet();

  $('quickBets').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const b = btn.dataset.b;
    if (b === 'all') range.value = maxBet;
    else if (b === 'half') range.value = Math.max(minBet, Math.round(maxBet / 2));
    else range.value = Math.min(maxBet, Math.max(minBet, +b));
    updateBet();
  });

  $('skipOrNextBtn').addEventListener('click', () => {
    goToHouse(S.pos + 1);
  });

  $('playAgainInHouseBtn').addEventListener('click', () => {
    renderBoard();
  });

  $('manualNextHouseBtn').addEventListener('click', () => {
    goToHouse(S.pos + 1);
  });

  $('playBtn').addEventListener('click', () => {
    const bet = Math.min(maxBet, Math.max(minBet, Math.round(range.value)));
    $('betbox').style.display = 'none';
    const body = $('gameBody');
    body.style.display = 'block';
    activeRound = true;
    S.money -= bet;
    renderStats();
    addLog(tpl(L.logBet, { pos: S.pos, bet: fmt(bet), game: g.name }));

    let finished = false;
    const finish = mult => {
      if (finished) return;
      finished = true;
      activeRound = false;

      const ret = Math.round(bet * mult);
      S.money += ret;
      house.done = true;
      house.rounds++;
      renderStats();
      renderPath();

      const net = ret - bet;
      if (net > 0) sfxWin();
      else if (net < 0) sfxLose();

      addLog(
        tpl(t().logResult, {
          icon,
          game: t().games[house.type].name,
          net: (net > 0 ? '+' : '') + fmt(net),
          mult
        }),
        net > 0 ? 'win' : net < 0 ? 'lose' : ''
      );

      if (S.money <= 0) {
        setTimeout(() => gameOver(), 900);
        return;
      }

      // Игрок САМ решает, когда перейти в следующий дом — показываем панель выбора
      const postBar = $('postRoundControls');
      if (postBar) postBar.style.display = 'flex';
    };

    startGame(house.type, body, bet, finish);
  });
}

function gameOver() {
  S.over = true;
  activeRound = false;
  const L = t();
  const ov = $('overlay');
  $('modal').innerHTML = `
    <div class="big">🚔</div>
    <h2>${L.prisonTitle}</h2>
    <p>${L.prisonDesc}</p>
    <button class="btn primary" id="ovBtn" type="button" style="margin-top:18px">${L.newGameBtn}</button>`;
  ov.classList.remove('hidden');
  $('ovBtn').addEventListener('click', newGame);
  addLog(L.logPrison, 'lose');
}

/* =====================================================================
   ИГРА 1 — ТАРАКАНЬИ БЕГА
   ===================================================================== */
function gameCockroach(root, bet, done) {
  const GOAL = 30;
  const g = t().games.cockroach;
  const emojis = ['🪳', '🐜', '🐞', '🦗'];
  const racers = g.racers.map((name, idx) => ({
    name,
    emoji: emojis[idx],
    pos: 0,
    human: idx === 0
  }));
  let over = false;

  root.innerHTML = `
    <div class="lanes" id="lanes"></div>
    <div class="row" id="diceRow" style="min-height:50px"></div>
    <div class="row"><button class="btn primary" id="rollBtn" type="button">${g.rollBtn}</button></div>
    <div id="res"></div>`;

  const lanesEl = root.querySelector('#lanes');
  const diceEl = root.querySelector('#diceRow');
  const rollBtn = root.querySelector('#rollBtn');
  const resEl = root.querySelector('#res');

  const drawLanes = () => {
    lanesEl.innerHTML = racers.map(r => `
      <div class="lane ${r.human ? 'human' : ''}">
        <span class="lane-name">${r.emoji} ${r.name}</span>
        <div class="lane-bar"><div class="lane-fill" style="width:${Math.min(100, (r.pos / GOAL) * 100)}%"></div></div>
        <span class="lane-pos">${r.pos}/${GOAL}</span>
      </div>`).join('');
  };
  drawLanes();

  rollBtn.addEventListener('click', () => {
    if (over) return;
    rollBtn.disabled = true;
    sfxRoll();

    const rolls = racers.map(() => d6());
    diceEl.innerHTML = rolls.map((v, i) => `<span class="die ${i === 0 ? 'human' : ''}">${v}</span>`).join('');
    racers.forEach((r, i) => { r.pos += rolls[i]; });

    setTimeout(() => {
      drawLanes();
      if (racers[0].pos >= GOAL) return endRound(true, g.win);
      const bot = racers.slice(1).find(r => r.pos >= GOAL);
      if (bot) return endRound(false, tpl(g.lose, { name: `${bot.emoji} ${bot.name}` }));
      rollBtn.disabled = false;
    }, 350);
  });

  function endRound(win, msg) {
    over = true;
    rollBtn.style.display = 'none';
    resEl.innerHTML = `<div class="result ${win ? 'win' : 'lose'}">${msg}</div>`;
    done(win ? 3 : 0);
  }
}

/* =====================================================================
   ИГРА 2 — ОЧКО 21
   ===================================================================== */
function gameBlackjack(root, bet, done) {
  const g = t().games.blackjack;
  const grid = [];
  for (let r = 0; r < 6; r++) {
    grid.push([]);
    for (let c = 0; c < 6; c++) grid[r].push(2 + Math.floor(Math.random() * 10));
  }
  let pSum = 0, dSum = 0, over = false;
  const pCards = [], dCards = [];

  root.innerHTML = `
    <div class="sumline">
      <div>${g.you}: <b id="pSum">0</b> <span id="pCards" style="color:var(--muted);font-size:13px"></span></div>
      <div>${g.dealer}: <b id="dSum">0</b> <span id="dCards" style="color:var(--muted);font-size:13px"></span></div>
    </div>
    <div id="gridBox"></div>
    <div class="row" id="bjActionRow">
      <button class="btn primary" id="hitBtn" type="button">${g.hit}</button>
      <button class="btn" id="standBtn" type="button">${g.stand}</button>
    </div>
    <div id="res"></div>`;

  const gridBox = root.querySelector('#gridBox');
  const resEl = root.querySelector('#res');
  const hitBtn = root.querySelector('#hitBtn');
  const standBtn = root.querySelector('#standBtn');
  const actionRow = root.querySelector('#bjActionRow');

  function drawGrid(hl) {
    let html = '<table class="cardgrid"><tr><th></th>';
    for (let c = 1; c <= 6; c++) html += `<th>${c}</th>`;
    html += '</tr>';
    for (let r = 0; r < 6; r++) {
      html += `<tr><th>${r + 1}</th>`;
      for (let c = 0; c < 6; c++) {
        const on = hl && hl[0] === r && hl[1] === c;
        html += `<td class="${on ? 'hl' : ''}">${grid[r][c]}</td>`;
      }
      html += '</tr>';
    }
    gridBox.innerHTML = html + '</table>';
  }
  drawGrid();

  function drawCard() {
    const r = d6() - 1, c = d6() - 1;
    return { r, c, v: grid[r][c] };
  }

  function updateUI() {
    root.querySelector('#pSum').textContent = pSum;
    root.querySelector('#dSum').textContent = dSum;
    root.querySelector('#pCards').textContent = pCards.length ? `(${pCards.map(x => x.v).join(' + ')})` : '';
    root.querySelector('#dCards').textContent = dCards.length ? `(${dCards.map(x => x.v).join(' + ')})` : '';
  }

  hitBtn.addEventListener('click', () => {
    if (over) return;
    sfxRoll();
    const card = drawCard();
    pSum += card.v;
    pCards.push(card);
    drawGrid([card.r, card.c]);
    updateUI();

    if (pSum > 21) {
      over = true;
      actionRow.style.display = 'none';
      resEl.innerHTML = `<div class="result lose">${tpl(g.bust, { sum: pSum })}</div>`;
      done(0);
    } else if (pSum === 21) {
      standBtn.click();
    }
  });

  standBtn.addEventListener('click', () => {
    if (over) return;
    over = true;
    actionRow.style.display = 'none';
    dealerTurn();
  });

  function dealerTurn() {
    if (dSum >= 17) return resolve();
    sfxRoll();
    const card = drawCard();
    dSum += card.v;
    dCards.push(card);
    drawGrid([card.r, card.c]);
    updateUI();
    setTimeout(dealerTurn, 550);
  }

  function resolve() {
    let mult, msg, cls;
    if (dSum > 21) {
      mult = 2; msg = tpl(g.dBust, { dSum }); cls = 'win';
    } else if (dSum > pSum) {
      mult = 0; msg = tpl(g.dWin, { dSum, pSum }); cls = 'lose';
    } else if (dSum < pSum) {
      mult = 2; msg = tpl(g.pWin, { pSum, dSum }); cls = 'win';
    } else {
      mult = 1; msg = tpl(g.push, { pSum }); cls = 'push';
    }
    resEl.innerHTML = `<div class="result ${cls}">${msg}</div>`;
    done(mult);
  }
}

/* =====================================================================
   ИГРА 3 — АВТОМАТ (СЛОТЫ)
   ===================================================================== */
function gameSlots(root, bet, done) {
  const g = t().games.slots;
  const base = ['🍒', '🍒', '🍒', '🍉', '🍉', '7️⃣'];
  const reels = [0, 1, 2].map(() => shuffle([...base]));
  let over = false;

  root.innerHTML = `
    <div class="reels" id="reels"></div>
    <div class="row" id="diceRow" style="min-height:50px"></div>
    <div class="row"><button class="btn primary" id="spinBtn" type="button">${g.spin}</button></div>
    <div id="res"></div>`;

  const reelsEl = root.querySelector('#reels');
  const diceEl = root.querySelector('#diceRow');
  const spinBtn = root.querySelector('#spinBtn');
  const resEl = root.querySelector('#res');

  function drawReels(hits) {
    reelsEl.innerHTML = reels.map((reel, ci) => `
      <div class="reel">
        ${reel.map((s, ri) => `<div class="cell ${hits && hits[ci] === ri ? 'hl' : ''}">${s}</div>`).join('')}
      </div>`).join('');
  }
  drawReels();

  spinBtn.addEventListener('click', () => {
    if (over) return;
    over = true;
    spinBtn.style.display = 'none';
    sfxRoll();

    const rolls = [d6(), d6(), d6()];
    const hits = rolls.map(r => r - 1);
    diceEl.innerHTML = rolls.map(v => `<span class="die">${v}</span>`).join('');

    setTimeout(() => {
      drawReels(hits);
      const syms = hits.map((h, i) => reels[i][h]);

      let mult = 0, msg, cls = 'lose';
      if (syms[0] === syms[1] && syms[1] === syms[2]) {
        if (syms[0] === '🍒') { mult = 2; msg = g.c2; cls = 'win'; }
        else if (syms[0] === '🍉') { mult = 5; msg = g.c5; cls = 'win'; }
        else { mult = 10; msg = g.c10; cls = 'win'; }
      } else {
        msg = tpl(g.miss, { syms: syms.join(' ') });
      }

      resEl.innerHTML = `<div class="result ${cls}">${msg}</div>`;
      done(mult);
    }, 420);
  });
}

/* =====================================================================
   ИГРА 4 — ДАРТС
   ===================================================================== */
function gameDarts(root, bet, done) {
  const g = t().games.darts;
  const THROWS = 5;
  const list = [];
  let over = false;

  root.innerHTML = `
    <div class="throws" id="throws"></div>
    <div class="sumline"><div>${g.sum}: <b id="total">0</b> / 111</div></div>
    <div class="row" id="diceRow" style="min-height:50px"></div>
    <div class="row"><button class="btn primary" id="throwBtn" type="button">${tpl(g.throwBtn, { cur: 1, max: THROWS })}</button></div>
    <div id="res"></div>`;

  const throwsEl = root.querySelector('#throws');
  const diceEl = root.querySelector('#diceRow');
  const totalEl = root.querySelector('#total');
  const throwBtn = root.querySelector('#throwBtn');
  const resEl = root.querySelector('#res');

  function drawThrows() {
    throwsEl.innerHTML = list.map(item =>
      `<div class="throw">${item.a} × ${item.b}<b>${item.p}</b></div>`).join('');
    totalEl.textContent = list.reduce((s, item) => s + item.p, 0);
  }

  throwBtn.addEventListener('click', () => {
    if (over) return;
    sfxRoll();
    const a = d6(), b = d6();
    list.push({ a, b, p: a * b });
    diceEl.innerHTML = `<span class="die">${a}</span><span class="die">${b}</span>`;
    drawThrows();

    if (list.length >= THROWS) {
      over = true;
      throwBtn.style.display = 'none';
      setTimeout(resolve, 450);
    } else {
      throwBtn.textContent = tpl(g.throwBtn, { cur: list.length + 1, max: THROWS });
    }
  });

  function resolve() {
    const total = list.reduce((s, item) => s + item.p, 0);
    let mult, msg, cls;
    if (total >= 111) { mult = 6; msg = tpl(g.w6, { total }); cls = 'win'; }
    else if (total >= 85) { mult = 2; msg = tpl(g.w2, { total }); cls = 'win'; }
    else if (total >= 60) { mult = 1; msg = tpl(g.w1, { total }); cls = 'push'; }
    else { mult = 0; msg = tpl(g.lose, { total }); cls = 'lose'; }
    resEl.innerHTML = `<div class="result ${cls}">${msg}</div>`;
    done(mult);
  }
}

/* =====================================================================
   ИГРА 5 — РУЛЕТКА
   ===================================================================== */
const RED_NUMS = [1, 2, 4, 6, 8, 10, 12];
const BLACK_NUMS = [3, 5, 9, 15, 16, 18, 20, 24, 25, 30, 36];

function gameRoulette(root, bet, done) {
  const g = t().games.roulette;
  let choice = 'red';
  let over = false;

  root.innerHTML = `
    <div class="opts" id="opts">
      <div class="opt sel" data-c="red">${g.redOpt}</div>
      <div class="opt" data-c="black">${g.blackOpt}</div>
      <div class="opt" data-c="num">${g.numOpt}
        <input class="numinput" id="numIn" type="number" min="1" max="36" value="6">
      </div>
    </div>
    <div class="legend">
      <span class="r">${g.redList}: ${RED_NUMS.join(', ')}</span><br>
      <span class="b">${g.blackList}: ${BLACK_NUMS.join(', ')}</span>
    </div>
    <div class="row" id="diceRow" style="min-height:50px;margin-top:12px"></div>
    <div class="row"><button class="btn primary" id="spinBtn" type="button">${g.spin}</button></div>
    <div id="res"></div>`;

  const optsEl = root.querySelector('#opts');
  const numIn = root.querySelector('#numIn');
  const diceEl = root.querySelector('#diceRow');
  const spinBtn = root.querySelector('#spinBtn');
  const resEl = root.querySelector('#res');

  optsEl.addEventListener('click', e => {
    const opt = e.target.closest('.opt');
    if (!opt || e.target === numIn) return;
    choice = opt.dataset.c;
    [...optsEl.children].forEach(o => o.classList.toggle('sel', o === opt));
  });

  numIn.addEventListener('input', () => {
    choice = 'num';
    [...optsEl.children].forEach(o => o.classList.toggle('sel', o.dataset.c === 'num'));
  });

  spinBtn.addEventListener('click', () => {
    if (over) return;
    over = true;
    spinBtn.style.display = 'none';
    sfxRoll();

    const a = d6(), b = d6();
    const p = a * b;
    diceEl.innerHTML = `<span class="die">${a}</span><span class="die">${b}</span>
      <span style="font-size:22px;color:var(--muted);align-self:center;margin-left:8px">= <b style="color:var(--gold);font-size:26px">${p}</b></span>`;

    setTimeout(() => {
      const isRed = RED_NUMS.includes(p);
      const colorName = isRed ? g.redWord : g.blackWord;
      let mult = 0, msg, cls = 'lose';

      if (choice === 'red' || choice === 'black') {
        const hit = (choice === 'red') === isRed;
        if (hit) { mult = 2; msg = tpl(g.winColor, { p, color: colorName }); cls = 'win'; }
        else { msg = tpl(g.loseColor, { p, color: colorName }); }
      } else {
        const n = Math.max(1, Math.min(36, parseInt(numIn.value, 10) || 1));
        if (p === n) { mult = 8; msg = tpl(g.winNum, { p }); cls = 'win'; }
        else { msg = tpl(g.loseNum, { p, n }); }
      }

      resEl.innerHTML = `<div class="result ${cls}">${msg}</div>`;
      done(mult);
    }, 450);
  });
}

/* =====================================================================
   ЗАПУСК И ОБРАБОТЧИКИ ВЕРХНЕЙ ПАНЕЛИ
   ===================================================================== */
function startGame(type, root, bet, done) {
  switch (type) {
    case 'cockroach': return gameCockroach(root, bet, done);
    case 'blackjack': return gameBlackjack(root, bet, done);
    case 'slots':     return gameSlots(root, bet, done);
    case 'darts':     return gameDarts(root, bet, done);
    case 'roulette':  return gameRoulette(root, bet, done);
  }
}

});

$('prevHouseTopBtn').addEventListener('click', () => {
  if (S.pos > 1) goToHouse(S.pos - 1);
});

$('nextHouseTopBtn').addEventListener('click', () => {
  if (S.pos === 0) goToHouse(1);
  else if (S.pos <= PATH_LENGTH) goToHouse(S.pos + 1);
});

$('restartTopBtn').addEventListener('click', newGame);

newGame();
</script>
</body>
</html>
